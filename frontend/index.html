<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TouchBack 실행 화면</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <header>
    <p class="eyebrow">TOUCHBACK · 실행 화면</p>
    <h1>조작한 뒤, 실제 결과를 확인하세요</h1>
    <p>사용자가 직접 인덕션을 조작합니다. 화면은 서버가 보고한 안내와 관측 결과를 보여줍니다.</p>
  </header>
  <section class="card" aria-labelledby="input-title">
    <h2 id="input-title">1. 목표 입력</h2>
    <form id="goal-form">
      <label for="user-input">원하는 조작</label>
      <textarea id="user-input" required rows="2">오른쪽 화구 화력을 한 단계 올려줘</textarea>
      <div class="grid">
        <label>입력 출처
          <select id="source"><option value="mock">모의 관측</option><option value="replay">녹화 재생</option><option value="live">실시간 센서</option></select>
        </label>
        <label>화구
          <select id="zone"><option value="right">오른쪽</option><option value="left">왼쪽</option><option value="">입력에서 해석</option></select>
        </label>
      </div>
      <button id="start" type="submit">실행 시작</button>
    </form>
  </section>
  <section class="card" aria-labelledby="state-title">
    <h2 id="state-title">2. 실행 상태</h2>
    <div class="badges"><strong id="origin">서버 연결 대기</strong><span id="mode">실행 방식: 확인 전</span><span id="run-id">실행 ID: 없음</span></div>
    <p id="status" class="status" role="status" aria-live="polite">목표를 입력해 실행하세요.</p>
    <p id="error" class="error" role="alert" hidden></p>
    <h3>현재 안내</h3>
    <p id="instruction">아직 안내가 없습니다.</p>
    <div class="actions"><button id="ack" disabled>조작 완료 알림</button><button id="cancel" class="secondary" disabled>실행 취소</button><button id="retry" class="secondary" disabled>상태 다시 확인</button><button id="repeat" class="secondary" disabled>안내 다시 듣기</button></div>
    <p id="speech-support" class="hint" role="status"></p>
    <p class="hint">조작 완료 알림은 성공 판정이 아닙니다. 센서 관측과 서버 판정을 기다리세요.</p>
  </section>
  <section class="card" aria-labelledby="result-title">
    <h2 id="result-title">3. 판정과 근거</h2>
    <p id="verdict">서버 판정을 기다리는 중입니다.</p>
    <h3>실행 기록</h3>
    <ol id="events" aria-label="실행 기록"><li>아직 기록이 없습니다.</li></ol>
  </section>
</main>
<script type="module" src="./app.mjs"></script>
</body>
</html>
