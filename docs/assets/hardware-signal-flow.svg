<text x="955" y="408" class="name" text-anchor="middle">ADS1115</text>
<text x="955" y="445" class="small" text-anchor="middle">좌우 두 채널</text>
<rect x="1165" y="270" width="370" height="173" rx="14" fill="#223b40" stroke="none"/>
<text x="1191" y="315" class="name" style="fill:#fff">ESP32</text>
<text x="1191" y="356" class="body" style="fill:#e5eeeb">비프음·출력 변화 요약</text>
<text x="1191" y="393" class="small" style="fill:#c2d7d2">보유/보드·핀맵 확인 필요</text>
<text x="1165" y="502" class="small" >Agent에는 관측·품질·시간을 전달</text>
