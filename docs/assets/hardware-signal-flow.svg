<ellipse cx="44" cy="43" rx="26" ry="18.2" fill="none" stroke="#b66c3c" stroke-width="5"/>
<ellipse cx="44" cy="43" rx="18" ry="12.6" fill="none" stroke="#b66c3c" stroke-width="5"/>
<ellipse cx="44" cy="43" rx="10" ry="7.0" fill="none" stroke="#b66c3c" stroke-width="5"/>
