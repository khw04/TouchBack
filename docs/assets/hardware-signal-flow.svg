<path d="M745 306 L849 306" fill="none" stroke="#b87b27" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#plan)"/>
<path d="M315 431 L421 431" fill="none" stroke="#b87b27" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#plan)"/>
