<path d="M1057 354 L1161 354" fill="none" stroke="#b87b27" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#plan)"/>
<text x="1105" y="331" class="tag" text-anchor="middle">I2C</text>
<rect x="40" y="574" width="430" height="123" rx="20" fill="#fff" stroke="#d8e5e2"/>
