<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
<title id="title">TouchBack 실물 관측 회로 구상과 현재 Mock 경로</title>
<desc id="desc">외부 좌우 코일을 아날로그 처리한 후 ADS1115와 ESP32로 수집하고, INMP441은 I2S로 ESP32에 연결하는 실물 구상. 현재는 Mock 관측을 서버 Claude Agent에 제공한다.</desc>
<style>text{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;fill:#172d32}.title{font-size:42px;font-weight:700}.sub{font-size:22px;fill:#51696e}.name{font-size:29px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#51696e}.tag{font-size:18px;font-weight:700;fill:#126854}.white{fill:#fff}.label{font-size:22px;font-weight:700}.tiny{font-size:17px;fill:#51696e}</style>
<rect x="0" y="0" width="1600" height="1140" rx="0" fill="#f3f8f5" stroke="none"/>
<defs>
<marker id="plan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
<path d="M0 0L8 4L0 8" fill="none" stroke="#b87b27" stroke-width="1.8"/>
</marker>
<marker id="now" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
<path d="M0 0L8 4L0 8" fill="none" stroke="#127b65" stroke-width="1.8"/>
</marker>
</defs>
<text x="40" y="65" class="title" >센서 신호가 Agent에 도착하기까지</text>
<text x="40" y="107" class="sub" >실물 경로는 환불 부품 포함 / 미구축 · 현재는 아래 초록 Mock 경로로 시연 · 핀 배선도 아님</text>
<rect x="40" y="155" width="300" height="380" rx="20" fill="#fff" stroke="#d8e5e2"/>
<text x="62" y="193" class="tag" >01</text>
<text x="62" y="233" class="name" >외부 픽업 코일</text>
<rect x="400" y="155" width="370" height="380" rx="20" fill="#fff" stroke="#d8e5e2"/>
<text x="422" y="193" class="tag" >02</text>
<text x="422" y="233" class="name" >아날로그 처리 회로</text>
<rect x="830" y="155" width="250" height="380" rx="20" fill="#fff" stroke="#d8e5e2"/>
<text x="852" y="193" class="tag" >03</text>
<text x="852" y="233" class="name" >ADC 수집</text>
<rect x="1140" y="155" width="420" height="380" rx="20" fill="#fff" stroke="#d8e5e2"/>
<text x="1162" y="193" class="tag" >04</text>
<text x="1162" y="233" class="name" >요약·전송</text>
