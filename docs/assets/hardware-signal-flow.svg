<text x="445" y="327" class="label" >LM358 + 신호 처리</text>
<rect x="425" y="390" width="320" height="83" rx="12" fill="#fcf7ec" stroke="#e1d3b3"/>
<text x="445" y="422" class="tag" >오른쪽 채널</text>
<text x="445" y="452" class="label" >LM358 + 신호 처리</text>
<text x="425" y="506" class="small" >정류·필터·입력 보호 구성은 검증 전</text>
<text x="65" y="506" class="tiny" >인덕션 내부를 개조하지 않는 구상</text>
<rect x="853" y="267" width="204" height="207" rx="14" fill="#ecf4fb" stroke="#cfdfeb"/>
<g transform="translate(908 285)">
<rect x="0" y="9" width="91" height="72" rx="9" fill="#3679a6" stroke="none"/>
<circle cx="9" cy="73" r="4" fill="#edc36b"/>
