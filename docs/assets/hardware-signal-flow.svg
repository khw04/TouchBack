<circle cx="69" cy="73" r="4" fill="#edc36b"/>
<circle cx="46" cy="39" r="18" fill="#cdd8d5"/>
<circle cx="46" cy="39" r="6" fill="#172d32"/>
</g>
<text x="181" y="622" class="name" >INMP441 · 비프음</text>
<text x="181" y="663" class="small" >음성 명령용 PC 마이크와 별개</text>
<path d="M470 633H1345V448" fill="none" stroke="#b87b27" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#plan)"/>
<text x="735" y="616" class="small" >I2S · 비프음 단서 수집</text>
<rect x="40" y="755" width="700" height="153" rx="18" fill="#e6f3eb" stroke="#9bc6b5"/>
<text x="65" y="796" class="name" >현재 구현 · 센서 없는 시연</text>
<text x="65" y="838" class="body" >가상 인덕션 → 좌우 출력 변화·비프음 Mock 관측</text>
<text x="65" y="879" class="small" >가상 화력·누른 버튼 정답을 Agent에 직접 전달하지 않음</text>
<rect x="845" y="755" width="690" height="153" rx="18" fill="#e6f3eb" stroke="#9bc6b5"/>
<text x="873" y="796" class="name" >PC / 서버 · Claude Agent</text>
<text x="873" y="838" class="body" >관측 검증 → Tool 선택 → 완료 / 중단 / 제한된 재안내</text>
<text x="873" y="879" class="small" >사용자가 직접 조작 · 자동 인덕션 제어 없음</text>
<path d="M740 832 L841 832" fill="none" stroke="#127b65" stroke-width="5" marker-end="url(#now)"/>
<path d="M1535 355H1577V832H1540" fill="none" stroke="#b87b27" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#plan)"/>
<text x="1190" y="727" class="small" >실물 확장 시 USB / JSON Lines</text>
<rect x="40" y="951" width="1495" height="91" rx="16" fill="#fff" stroke="#d8e5e2"/>
<text x="65" y="988" class="tag" >환불 부품</text>
<text x="230" y="988" class="body" >GY-906 / MLX90614 → 잔열 관측</text>
<text x="860" y="988" class="body" >5V 진동모터 → 촉각 안내</text>
<text x="230" y="1022" class="small" >디바이스마트 전액 환불 · 현재 미확보 / 시연 경로에서 제외</text>
<path d="M40 1085 L105 1085" fill="none" stroke="#b87b27" stroke-width="4" stroke-dasharray="9 7"/>
<text x="120" y="1092" class="small" >미구축 실물 구상</text>
<path d="M385 1085 L450 1085" fill="none" stroke="#127b65" stroke-width="5" />
<text x="465" y="1092" class="small" >현재 Mock 경로</text>
<text x="820" y="1092" class="small" >저항값·전원·핀맵·입력 보호·실측 보정은 미확정</text>
</svg>
